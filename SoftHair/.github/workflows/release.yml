name: Release

# Dispara em push de tag v*.*.* (ex: v3.0.1, v3.1.0).
# Builda Windows + Linux em paralelo, publica no GitHub Releases.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root deps
        run: npm install --legacy-peer-deps
        # postinstall já instala backend + frontend

      - name: Build frontend
        run: npm run build:frontend

      - name: Build & publish (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish=always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & publish (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --publish=always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
