<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- E13 + P3-A2/P3-A7: CSP defesa em profundidade.
         - `connect-src` limitado a loopback (sem `https:` aberto e sem `wss:`)
           porque todo tráfego cloud passa pelo backend embarcado em 127.0.0.1.
         - `img-src` mantém `https:` para fotos de cliente/profissional via
           remote URL (ex: avatars). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: https:; connect-src 'self' http://127.0.0.1:* http://localhost:*; font-src 'self' data:;">
    <title>Salão de Beleza - Sistema de Administração</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
